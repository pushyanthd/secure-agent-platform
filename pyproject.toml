[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "1.0.0"
description = "A local laboratory for agent authorization and adversarial evaluation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
agentguard = "agentguard.cli:app"

[tool.hatch.build]
artifacts = ["src/agentguard/ui/**"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "httpx2>=2.13.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
